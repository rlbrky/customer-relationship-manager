# Use it to ACTIVATE REAL SENDS
# Active profiles are on IDE: dev, resend - NEVER an env var or shell profile
crm.mail.provider=resend

# Until a domain is verified, Resend only accepts this sender
# Only delivers to the address the account was created with.
crm.mail.from=onboarding@resend.dev

# Every email goes here instead, its subject prefixed with the intended recipient.
# Mandatory while the domain is unverified - Resend refuses anyone else.
# The two variables have EMPTY defaults on purpose. In @ConfigurationProperties
# binding an unresolved ${...} is not an error: Spring keeps the literal text, so a
# missing key would bind as the string "${CRM_MAIL_API_KEY}", pass every check, and
# get a 401 on each send. With ":" a missing variable becomes "", and
# ResendEmailSender refuses to start, naming the variable to set.
crm.mail.redirect-to=${CRM_MAIL_REDIRECT_TO:}

crm.mail.resend.api-key=${CRM_MAIL_API_KEY:}