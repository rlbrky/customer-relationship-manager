spring.application.name=crm

# datasource setup
spring.datasource.url=jdbc:mysql://localhost:3307/crm
spring.datasource.username=crm_user
spring.datasource.password=${CRM_DB_PASSWORD}
# pool waits 5 sec. max for a connection
spring.datasource.hikari.connection-timeout=5000

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Docker
spring.docker.compose.file=compose.yaml

# Actuator
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=always

# dev profile
spring.profiles.active=dev

# ensure users cant request more than this much pages
spring.data.web.pageable.max-page-size=100

# CSV upload. The default is 1MB — roughly 10,000 account rows, which you will not
# hit by accident and will hit eventually. Exceeding it throws
# MaxUploadSizeExceededException; see GlobalExceptionHandler for the 413.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
