spring.application.name=crm

# datasource setup
spring.datasource.url=jdbc:mysql://localhost:3307/crm
spring.datasource.username=crm_user
spring.datasource.password=${CRM_DB_PASSWORD}
# pool waits 5 sec. max for a connection
spring.datasource.hikari.connection-timeout=5000

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Docker
spring.docker.compose.file=compose.yaml

# Actuator
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=always

# dev profile
spring.profiles.active=dev